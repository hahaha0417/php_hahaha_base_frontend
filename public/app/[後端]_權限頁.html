    <script>
    $("#tagMenu button").on("click", function () {

        // 切換 active 樣式
        $("#tagMenu button").removeClass("active");
        $(this).addClass("active");

        let tag = $(this).data("tag");

        if (tag === "all") {
            $(".tag-item").show();
        } else {
            $(".tag-item").hide();
            $(`.tag-item[data-tag='${tag}']`).show();
        }
    });

    $("#tagMenu button.tech").click();
    </script>
