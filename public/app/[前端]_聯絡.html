    <script type="text/javascript" src="asset/leaflet/leaflet_map_test.js?v=1.0.0"></script>
    <script>
        

        const lat = 24.965567;
        const lng = 121.219000;

        let map_ = new leaflet_map_test("map", 
            "Google道路圖", 
            lat, 
            lng
        );
        
        var green_icon = L.divIcon({
            className: "",
            html: `
                <svg width="36" height="36" viewBox="0 0 24 24">
                    <path fill="#c9ffc9" stroke="#69ff69" stroke-width="2"
                        d="M12 2C8.134 2 5 5.134 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.866-3.134-7-7-7z"/>
                </svg>
            `,
            iconSize: [36, 36],
            iconAnchor: [18, 36]
        });

        L.marker([lat, lng], { icon: green_icon }).addTo(map_.map)
            .bindPopup('hahaha.')
            .openPopup();

    
    </script>
